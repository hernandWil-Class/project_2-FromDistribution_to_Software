[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "survivallab"
version = "0.1.0"
description = "Synthetic-data teaching application for exponential survival analysis"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy>=1.26,<3",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
notebook = [
  "jupyter>=1.1,<2",
  "lifelines>=0.30,<1",
  "matplotlib>=3.9,<4",
  "pandas>=2.2,<4",
]
db = [
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0.36,<3",
]
api = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "httpx>=0.28,<1",
]
dashboard = [
  "pandas>=2.2,<4",
  "requests>=2.32,<3",
  "streamlit>=1.42,<2",
]
dev = [
  "mypy>=1.14,<2",
  "pip-audit>=2.8,<3",
  "pre-commit>=4.1,<5",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
survivallab = "survivallab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/survivallab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: requires a disposable PostgreSQL database"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["pandas"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["survivallab"]
branch = true
