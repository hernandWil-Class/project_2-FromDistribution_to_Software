name: SurvivalLab CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@0a5c615913eeded8e31fcd3399a77f68f2a0a9c5
        with:
          python-version: "3.11"
      - name: Install pinned uv
        run: python -m pip install --disable-pip-version-check uv==0.11.9
      - name: Install locked environments
        run: uv sync --locked --all-extras --all-groups
      - name: Run formatting, lint, typing, and unit tests
        run: make quality
      - name: Execute teaching notebooks
        run: >-
          uv run --locked --extra notebook jupyter nbconvert --execute --to notebook
          --output-dir .notebook-runs --ExecutePreprocessor.timeout=120
          notebooks/01_synthetic_data.ipynb notebooks/02_likelihood.ipynb
      - name: Audit locked dependencies and scan for secrets
        run: make security

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@0a5c615913eeded8e31fcd3399a77f68f2a0a9c5
        with:
          python-version: "3.11"
      - name: Install pinned uv
        run: python -m pip install --disable-pip-version-check uv==0.11.9
      - name: Install locked environments
        run: uv sync --locked --all-extras --all-groups
      - name: Start isolated local services
        run: |
          make init-local-secrets
          make up
      - name: Verify migrations and analytics publication
        run: |
          make migrate
          make seed-fixture
          make refresh
          curl --fail --silent --show-error http://127.0.0.1:8000/health/ready
          curl --fail --silent --show-error http://127.0.0.1:8501/_stcore/health
          curl --fail --silent --show-error 'http://127.0.0.1:8000/survival?months=24' |
            uv run python -c 'import json,sys; p=json.load(sys.stdin); assert abs(p["survival_probability"]-0.4910982295021551)<1e-12'
      - name: Check database role restrictions
        run: |
          if docker compose exec -T db psql -U survivallab_reader -d survivallab -c 'SELECT * FROM raw.observations LIMIT 1' >/dev/null 2>&1; then
            echo 'reader unexpectedly accessed raw observations' >&2
            exit 1
          fi
          if docker compose exec -T db psql -U survivallab_ingest -d survivallab -c 'UPDATE raw.observations SET version=version' >/dev/null 2>&1; then
            echo 'ingest role unexpectedly updated immutable observations' >&2
            exit 1
          fi
      - name: Run PostgreSQL repository integration tests
        run: |
          set -eu
          set -a
          . ./.env
          set +a
          docker compose exec -T db sh -c 'createdb -U "$POSTGRES_USER" survivallab_test'
          export SURVIVALLAB_TEST_DATABASE_URL="postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:5432/survivallab_test"
          make test-integration
      - name: Verify backup and isolated restore
        run: |
          make backup
          backup=$(find backups -maxdepth 1 -type f -name 'survivallab-*.dump' -print | sort | tail -n 1)
          make restore-test "BACKUP=$backup"
      - name: Parse DAG in its pinned Airflow image
        run: make airflow-dag-check
      - name: Verify destructive reset requires confirmation
        run: |
          if make reset-data; then
            echo 'reset-data unexpectedly ran without confirmation' >&2
            exit 1
          fi
      - name: Report services without removing persistent volumes
        if: always()
        run: docker compose ps -a
