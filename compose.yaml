x-airflow-environment: &airflow-environment
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
  AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?run make init-local-secrets}
  AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_API_JWT_SECRET:?run make init-local-secrets}
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api:8080/execution/
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg://${AIRFLOW_DB_USER:-survivallab_airflow}:${AIRFLOW_DB_PASSWORD}@airflow-db:5432/${AIRFLOW_DB_NAME:-survivallab_airflow}
  AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
  AIRFLOW__API__BASE_URL: http://localhost:8081
  SURVIVALLAB_REFRESH_URL: http://api:8000/pipeline/refresh

services:
  db:
    image: postgres:16.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?run make init-local-secrets}
      POSTGRES_USER: ${POSTGRES_USER:-survivallab_migrator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make init-local-secrets}
      INGEST_PASSWORD: ${INGEST_PASSWORD:?run make init-local-secrets}
      READ_PASSWORD: ${READ_PASSWORD:?run make init-local-secrets}
      PIPELINE_PASSWORD: ${PIPELINE_PASSWORD:?run make init-local-secrets}
      ANALYTICS_PASSWORD: ${ANALYTICS_PASSWORD:?run make init-local-secrets}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["/app/.venv/bin/alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-survivallab_migrator}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-survivallab}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      INGEST_DATABASE_URL: postgresql+psycopg://survivallab_ingest:${INGEST_PASSWORD}@db:5432/${POSTGRES_DB:-survivallab}
      READ_DATABASE_URL: postgresql+psycopg://survivallab_reader:${READ_PASSWORD}@db:5432/${POSTGRES_DB:-survivallab}
      PIPELINE_DATABASE_URL: postgresql+psycopg://survivallab_pipeline:${PIPELINE_PASSWORD}@db:5432/${POSTGRES_DB:-survivallab}
      API_KEY: ${API_KEY:?run make init-local-secrets}
      DBT_PROFILE_HOST: db
      DBT_PROFILE_DATABASE: ${POSTGRES_DB:-survivallab}
      DBT_PROFILE_USER: survivallab_analytics
      DBT_PROFILE_PASSWORD: ${ANALYTICS_PASSWORD}
      DBT_PROFILE_PORT: "5432"
      SURVIVALLAB_DBT_COMMAND: /app/dbt/.venv/bin/dbt
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /app/dbt/target
      - /app/dbt/logs
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    user: "10001:10001"
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    environment:
      SURVIVALLAB_API_URL: http://api:8000
      API_KEY: ${API_KEY:?run make init-local-secrets}
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    user: "10002:10002"
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  airflow-db:
    image: postgres:16.4
    profiles: ["orchestration"]
    environment:
      POSTGRES_DB: ${AIRFLOW_DB_NAME:-survivallab_airflow}
      POSTGRES_USER: ${AIRFLOW_DB_USER:-survivallab_airflow}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?run make init-local-secrets}
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  airflow-init:
    image: apache/airflow:3.4.0-python3.11@sha256:be92e15d57c5be726fc39a91cd09cce8f7488483b67979e0fb74c1a2c7cfb4e2
    profiles: ["orchestration"]
    user: "50000:0"
    command: ["bash", "/opt/airflow/init.sh"]
    environment:
      <<: *airflow-environment
      AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-survivallab-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?run make init-local-secrets}
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./airflow/init.sh:/opt/airflow/init.sh:ro
      - airflow_logs:/opt/airflow/logs
    depends_on:
      airflow-db:
        condition: service_healthy
    restart: "no"

  airflow-api:
    image: apache/airflow:3.4.0-python3.11@sha256:be92e15d57c5be726fc39a91cd09cce8f7488483b67979e0fb74c1a2c7cfb4e2
    profiles: ["orchestration"]
    user: "50000:0"
    command: ["api-server"]
    environment: *airflow-environment
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - airflow_logs:/opt/airflow/logs
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v2/monitor/health', timeout=2)"
      interval: 15s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  airflow-scheduler:
    image: apache/airflow:3.4.0-python3.11@sha256:be92e15d57c5be726fc39a91cd09cce8f7488483b67979e0fb74c1a2c7cfb4e2
    profiles: ["orchestration"]
    user: "50000:0"
    command: ["scheduler"]
    environment:
      <<: *airflow-environment
      SURVIVALLAB_API_KEY: ${API_KEY:?run make init-local-secrets}
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - airflow_logs:/opt/airflow/logs
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-api:
        condition: service_healthy
    restart: unless-stopped

  airflow-dag-processor:
    image: apache/airflow:3.4.0-python3.11@sha256:be92e15d57c5be726fc39a91cd09cce8f7488483b67979e0fb74c1a2c7cfb4e2
    profiles: ["orchestration"]
    user: "50000:0"
    command: ["dag-processor"]
    environment: *airflow-environment
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - airflow_logs:/opt/airflow/logs
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-triggerer:
    image: apache/airflow:3.4.0-python3.11@sha256:be92e15d57c5be726fc39a91cd09cce8f7488483b67979e0fb74c1a2c7cfb4e2
    profiles: ["orchestration"]
    user: "50000:0"
    command: ["triggerer"]
    environment: *airflow-environment
    volumes:
      - airflow_logs:/opt/airflow/logs
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  airflow_postgres_data:
  airflow_logs:
